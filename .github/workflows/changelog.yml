name: Changelog

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo com historico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar CHANGELOG.md
        run: |
          {
            echo "# Changelog"
            echo
            git log --no-merges \
              --invert-grep --grep="^docs: atualiza changelog" \
              --pretty=tformat:"- %s (%an, %ad)" --date=short
          } > CHANGELOG.md

      - name: Commitar se houve mudanca
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Changelog sem mudancas."
          else
            git commit -m "docs: atualiza changelog [skip ci]"
            git push
          fi